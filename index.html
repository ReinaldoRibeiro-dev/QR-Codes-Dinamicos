<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecionando…</title>
<style>body{font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;color:#14171f;background:#f6f7f9}
@media(prefers-color-scheme:dark){body{background:#101216;color:#eceef2}}a{color:#4f46e5}</style></head>
<body><div id="m"><p>Redirecionando…</p></div>
<script>
(async()=>{
  const m=document.getElementById('m'),id=new URLSearchParams(location.search).get('c');
  if(!id){m.innerHTML='<p>Nenhum código informado.</p><p><a href="admin.html">Painel de administração</a></p>';return;}
  try{
    const r=await fetch('codes.json?t='+Date.now(),{cache:'no-store'});
    const c=(await r.json()).codes.find(x=>x.id===id);
    if(c&&/^https?:\/\//i.test(c.url)){m.innerHTML='<p>Redirecionando…</p><p><a id="g">Abrir destino</a></p>';
      document.getElementById('g').href=c.url;location.replace(c.url);return;}
    m.innerHTML='<p>QR code não encontrado.</p>';
  }catch(e){m.innerHTML='<p>Erro ao carregar. Tente novamente.</p>';}
})();
</script></body></html>
